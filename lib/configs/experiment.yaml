# Experiment 12 Configuration
# Example: Small test with flexible train/val/test splits using DayCentDatasetV2

experiment_id: experiment14
description: "SOMSC Modelling focus"

data:
  base_dir: /users/6/mehta423/daycent/data/SAS_KGML_090925
  use_synthetic: true
  max_workers: 4
  
  # Train split configuration
  train:
    # Scenarios: can use explicit list or range
    scenario_range:
      start: 1
      end: 50  # Will use scenarios 1-50
    
    # Points: can use quadrants or explicit list (explicit takes precedence)
    quadrants:
      - 'Q1 (SW)'
      - 'Q3 (NW)'
    # points: ['1', '2', '3']  # Uncomment to use explicit points instead
    
    # Years: can use explicit list or range
    year_range:
      start: 2000
      end: 2020  # Will use years 2000-2020
  
  # Validation split configuration
  val:
    scenario_range:
      start: 1
      end: 50

    quadrants:
      - 'Q1 (SW)'
      - 'Q3 (NW)'
    
    year_range:
      start: 2015
      end: 2020
  
  # Test split configuration
  test:
    # Example with explicit scenario list
    scenarios:
      - '51'
      - '52'
      - '53'
      - '54'
      - '55'
    
    quadrants:
      - 'Q3 (NW)'

    years: [2020, 2021, 2022, 2023, 2024]  # Explicit year list

model: # this is not yet implemented. model just takes args from sample size
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

training:
  batch_size: 2048
  epochs: 50
  learning_rate: 0.001
  device: cuda:2
  
  somsc_loss_weight: 5.0
  yield_loss_weight: 0
  
  scheduler_factor: 0.5
  scheduler_patience: 3
  
  random_seed: 42
  num_workers: 2

wandb:
  enabled: true  # Disable for quick tests
  project: daycent
  name: "experiment14/somsc_focus"
  notes: "Focusing on SOMSC modeling, first test run."
  tags:
    - test
    - datasetv2
    - debug

