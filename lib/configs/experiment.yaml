experiment_id: experiment15
description: "SOMSC and Yield Modelling focus"

data:
  base_dir: /users/6/mehta423/daycent/data/SAS_KGML_090925
  use_synthetic: true
  max_workers: 4
  
  # Train split configuration
  train:
    # Scenarios: can use explicit list or range
    scenario_range:
      start: 1
      end: 50  # Will use scenarios 1-50
    
    # Points: can use quadrants or explicit list (explicit takes precedence)
    quadrants:
      - 'Q1 (SW)'
      - 'Q3 (NW)'
    # points: ['1', '2', '3']  # Uncomment to use explicit points instead
    
    # Years: can use explicit list or range
    year_range:
      start: 2002
      end: 2020  # Will use years 2002-2020

  # Validation split configuration
  val:
    scenario_range:
      start: 1
      end: 50

    quadrants:
      - 'Q1 (SW)'
      - 'Q3 (NW)'
    
    year_range:
      start: 2015
      end: 2020
  
  # Test split configuration
  test:
    # Example with explicit scenario list
    scenarios:
      - '51'
      - '52'
      - '53'
      - '54'
      - '55'
    
    quadrants:
      - 'Q3 (NW)'

    # years: [2020, 2021, 2022, 2023, 2024]  # Explicit year list
    year_range:
      start: 2020
      end: 2024

model:
  model_type: daycent        # Options: 'daycent' or 'transformer'
  # For daycent (LSTM) model:
  hidden_dim: 64
  latent_dim: 32
  lstm_layers: 1
  dropout: 0.1
  # For transformer model (uncomment if using model_type: transformer):
  # d_model: 128
  # nhead: 4
  # num_layers: 2
  # dim_feedforward: 256

training:
  batch_size: 2048
  epochs: 50
  device: cuda:2
  
  somsc_loss_weight: 10.0
  yield_loss_weight: 1.0
  grad_clip_norm: 1.0
  
  # Optimizer configuration
  optimizer:
    name: adamw
    lr: 0.01
    weight_decay: 0.01
  
  # Scheduler configuration
  # scheduler:
  #   name: warmup_cosine
  #   warmup_ratio: 0.1
  #   min_lr_ratio: 0.01

  scheduler:
    name: cosine
    eta_min: 0.001

  
  random_seed: 42
  num_workers: 2

wandb:
  enabled: true  # Disable for quick tests
  project: daycent
  name: "experiment15/somsc_yield_focus"
  notes: "Focusing on SOMSC and Yield modeling, 2nd test run, dynamic loss weighting."
  tags:
    - test
    - datasetv2
    - debug

