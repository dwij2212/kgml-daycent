model:
  # model_type: daycent        # Options: 'daycent' or 'transformer'
  # # For daycent (LSTM) model:
  # hidden_dim: 64
  # latent_dim: 32
  # lstm_layers: 1
  # dropout: 0.1
  model_type: daycent
  hidden_dim: 64
  latent_dim: 32
  lstm_layers: 1
  dropout: 0.1
  # # For transformer model (uncomment if using model_type: transformer):
  # d_model: 128
  # nhead: 4
  # num_layers: 2
  # dim_feedforward: 256

training:
  batch_size: 512
  epochs: 300
  device: cuda:2
  
  somsc_loss_weight: 1.0
  yield_loss_weight: 1.0
  grad_clip_norm: 5.0
  
  # Optimizer configuration
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.01
  
  # Scheduler configuration
  # scheduler:
  #   name: warmup_cosine
  #   warmup_ratio: 0.1
  #   min_lr_ratio: 0.01

  scheduler:
    name: reduce_on_plateau
    patience: 10
    factor: 0.5

  
  random_seed: 42
  num_workers: 2

wandb:
  enabled: false  # Disable for quick tests
  project: daycent
  name: "experiment15/somsc_yield_focus"
  notes: "Focusing on SOMSC and Yield modeling, 2nd test run, dynamic loss weighting."
